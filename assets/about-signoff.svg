<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" role="img" aria-labelledby="title desc">
<title id="title">Build thoughtfully. Experiment boldly. Keep learning.</title>
<desc id="desc">Cedar and Stone themed closing statement in a forest green panel.</desc>
<rect x="1" y="1" width="1198" height="90" rx="14" fill="#17241D" stroke="#45594B" stroke-width="2"/>
<rect x="1" y="17" width="6" height="58" rx="3" fill="#B47D58"/>
<text x="42" y="55" fill="#F1EBDD" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing=".5">BUILD THOUGHTFULLY.</text>
<circle cx="436" cy="47" r="4" fill="#B47D58"/>
<text x="472" y="55" fill="#AFC0B0" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing=".5">EXPERIMENT BOLDLY.</text>
<circle cx="880" cy="47" r="4" fill="#B47D58"/>
<text x="916" y="55" fill="#D7BD78" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing=".5">KEEP LEARNING.</text>
</svg>