<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" role="img" aria-labelledby="title desc">
<title id="title">Build thoughtfully. Experiment boldly. Keep learning.</title>
<desc id="desc">Solar System themed closing statement in a deep space panel.</desc>
<rect x="1" y="1" width="1198" height="90" rx="14" fill="#070B18" stroke="#3D4F73" stroke-width="2"/>
<rect x="1" y="17" width="6" height="58" rx="3" fill="#F0C75E"/>
<text x="42" y="55" fill="#E8EEF8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing=".5">BUILD THOUGHTFULLY.</text>
<circle cx="436" cy="47" r="4" fill="#F0C75E"/>
<text x="472" y="55" fill="#A8B4D0" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing=".5">EXPERIMENT BOLDLY.</text>
<circle cx="880" cy="47" r="4" fill="#5BC0EB"/>
<text x="916" y="55" fill="#F0C75E" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing=".5">KEEP LEARNING.</text>
</svg>
