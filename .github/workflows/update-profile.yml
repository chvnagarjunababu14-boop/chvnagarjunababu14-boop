name: Update Solar System Profile
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIF renderer
        run: python -m pip install Pillow
      - name: Generate profile data and SVG
        env:
          GITHUB_USERNAME: chvnagarjunababu14-boop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.js
      - name: Render animated solar system GIF
        run: python scripts/render_animation.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/solar-system.svg assets/solar-data.json assets/solar-system.gif
          git diff --cached --quiet || git commit -m "chore: update animated solar system profile"
          git push
