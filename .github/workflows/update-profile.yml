name: Refresh Glass Profile
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate generator syntax
        run: node --check scripts/generate.js
      - name: Generate polished profile from public GitHub data
        env:
          GITHUB_USERNAME: chvnagarjunababu14-boop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.js
      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ scripts/
          git diff --cached --quiet || git commit -m "chore: refresh glass profile"
          git push
