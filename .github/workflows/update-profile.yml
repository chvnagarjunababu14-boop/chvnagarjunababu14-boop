name: Refresh Cedar & Stone Profile (Validated)
on:
  push:
    paths:
      - 'scripts/generate.js'
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate generator syntax
        run: node --check scripts/generate.js
      - name: Generate polished profile from public GitHub data
        env:
          GITHUB_USERNAME: chvnagarjunababu14-boop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.js
      - name: Validate generated README and image assets
        run: python3 scripts/validate_profile.py
      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ scripts/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh cedar and stone profile"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
